  <style>
    :root{--wine:#2f2526;--paper:#f2eee7;--coral:#d87967}

    .actions{display:flex;align-items:center;gap:25px;flex-wrap:wrap;margin-top:50px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:14px 19px;background:var(--coral);color:#241d1d;font-size:12px;font-weight:700;text-decoration:none}

    .text-link{font-size:12px;text-decoration:none;border-bottom:1px solid rgba(246,240,233,.6);padding-bottom:7px}
    .text-link:hover{border-color:#e2a08f}

    @media(max-width:360px){.topbar{padding-left:20px;padding-right:20px}.brand-name{font-size:18px}.brand-symbol{width:21px;height:21px}.nav{gap:8px}.nav a{font-size:10px}}
  

/* Vedi Vibe footer — scoped styles; only the existing footer changes */
.vf-footer{display:block;background:#241c1e;color:#e8dcd3;padding:0 clamp(25px,5vw,76px);font:400 12px/1.5 "Segoe UI",Arial,sans-serif}

.vf-footer-logo{display:inline-flex;align-items:center;gap:10px;min-height:48px;color:#f5eee8;text-decoration:none!important;font:400 27px/1 Georgia,"Times New Roman",serif;letter-spacing:-.055em}
.vf-footer-logo:hover{color:#fff}
.vf-mark{width:29px;height:29px;flex:none;color:#dba18e}
.vf-footer-follow{display:flex;align-items:center;gap:20px}
.vf-footer-label{color:#b6a49b;font:600 10px/1.2 "Segoe UI",Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}
.vf-socials{display:flex;align-items:center;gap:9px}
.vf-social{width:44px;height:44px;border:1px solid rgba(246,240,233,.29);border-radius:50%;color:#f1ded5!important;display:inline-flex;align-items:center;justify-content:center;flex:none;text-decoration:none!important;transition:background-color .15s ease,border-color .15s ease,transform .15s ease}
.vf-social:hover{background:#4b3434;border-color:#dba18e;transform:translateY(-2px)}
.vf-social:focus-visible,.vf-footer-logo:focus-visible,.vf-footer-privacy:focus-visible{outline:3px solid #df9b82;outline-offset:3px}
.vf-footer-meta{display:flex;align-items:center;justify-content:space-between;gap:9px 22px;flex-wrap:wrap;padding:19px 0 23px;border-top:1px solid rgba(246,240,233,.2);font-size:11px;color:#bcaca3;letter-spacing:.01em}
.vf-footer-subtitle{color:#a99990}
.vf-footer-privacy{color:#f0dfd4!important;text-decoration:underline;text-decoration-color:rgba(240,223,212,.35);text-underline-offset:4px}
.vf-footer-privacy:hover{text-decoration-color:#f0dfd4}
@media(max-width:700px){.vf-footer-main{flex-direction:column;align-items:flex-start;padding:25px 0 23px;gap:17px}.vf-footer-logo{font-size:24px}.vf-footer-follow{justify-content:space-between;width:100%;gap:10px}.vf-footer-meta{align-items:flex-start;flex-direction:column;gap:10px;padding-top:18px;padding-bottom:24px}.vf-footer-subtitle{order:3}.vf-social{width:44px;height:44px}}
@media(prefers-reduced-motion:reduce){.vf-social{transition:none}}

</style>
